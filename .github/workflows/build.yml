name: Build & Release

# Replicates everything soroban-build-workflow does, but in a single job so
# Rust compilation is shared across all 31 combinations and Swatinem/rust-cache
# keeps subsequent runs fast. Creates one GitHub release with all 31 WASMs.
#
# soroban-build-workflow was not used directly because it:
#   - pins stellar-cli v25.1.0 (before spec-shaking support landed in v25.2.0)
#   - creates a separate GitHub release per contract (31 releases, not 1)
#   - has no Cargo caching

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g. v0.7.2)'
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      # Cache ~/.cargo/registry and target/ — first run cold, subsequent runs fast
      - uses: Swatinem/rust-cache@v2

      # v26.0.0: Protocol 26 support, spec shaking, --optimize is now the default
      - uses: stellar/stellar-cli@v28.1.0
        with:
          version: '26.0.0'

      - name: Resolve release name
        id: release
        run: echo "name=${{ inputs.release_name || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Get workspace version
        id: ver
        run: |
          VER=$(sed -n '/\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml)
          echo "value=$VER" >> "$GITHUB_OUTPUT"

      - name: Build all combinations
        run: |
          mkdir -p wasms
          for pkg in $(ls generated/ | grep -v README.md); do
            stellar contract build \
              --package "$pkg" \
              --out-dir wasms \
              --meta "source_repo=github:${{ github.repository }}" \
              --meta "home_domain=rgstry.xyz"

            # stellar contract build names the output after the Rust lib name
            # (hyphens become underscores). Rename to the canonical form used by
            # soroban-build-workflow: <package>_v<version>.wasm
            lib="${pkg//-/_}"
            mv "wasms/${lib}.wasm" "wasms/${pkg}_v${{ steps.ver.outputs.value }}.wasm"
          done

      - name: Post build info to stellar.expert (contract validation matching)
        run: |
          for wasm in wasms/*.wasm; do
            pkg=$(basename "$wasm" | sed 's/_v[0-9].*//')
            hash=$(sha256sum "$wasm" | cut -d' ' -f1)
            curl -sX POST \
              "https://api.stellar.expert/explorer/public/contract-validation/match" \
              -H "Content-Type: application/json" \
              -d "{
                \"repository\": \"${{ github.server_url }}/${{ github.repository }}\",
                \"commitHash\": \"${{ github.sha }}\",
                \"jobId\":       \"${{ github.job }}\",
                \"runId\":       \"${{ github.run_id }}\",
                \"contractHash\":\"$hash\",
                \"packageName\": \"$pkg\"
              }" \
              --max-time 15 || true
          done

      - name: Attest WASMs
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'wasms/*.wasm'

      - name: Create GitHub release with all WASMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.name }}" wasms/*.wasm \
            --title "${{ steps.release.outputs.name }}" \
            --notes "Pre-built Soroban WASM combinations compiled against OpenZeppelin stellar-contracts ${{ steps.release.outputs.name }}."
