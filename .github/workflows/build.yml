name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g. v0.7.2)'
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  # Step 1: read the committed generated/ directory to build the matrix.
  # The build jobs do their own repo checkout, so they use the committed files.
  generate:
    runs-on: ubuntu-latest
    outputs:
      combinations: ${{ steps.list.outputs.combinations }}
    steps:
      - uses: actions/checkout@v4

      - name: List combinations
        id: list
        run: |
          names=$(ls generated/ | grep -v README.md | jq -R . | jq -sc .)
          echo "combinations=$names" >> "$GITHUB_OUTPUT"

  # Step 2: build each combination in parallel using soroban-build-workflow.
  # All jobs share the same release_name so their WASMs land in one release.
  build:
    needs: generate
    strategy:
      matrix:
        combination: ${{ fromJson(needs.generate.outputs.combinations) }}
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ inputs.release_name || github.ref_name }}
      release_description: >
        Pre-built Soroban WASM combinations compiled against
        OpenZeppelin stellar-contracts ${{ github.ref_name }}.
      package: ${{ matrix.combination }}
      relative_path: 'generated/${{ matrix.combination }}'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
