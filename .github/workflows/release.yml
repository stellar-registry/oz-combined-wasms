name: Release

# Full auto-release pipeline (modeled on stellar-registry/perch's release
# flow, built from the stellar-registry/actions reusable workflows):
#
#   1. `detect-releases` — on every push to main, tag `v<version>` when
#      [workspace.package].version has no matching tag yet. The version is
#      bumped by update.yml's PR (it tracks the OZ stellar-contracts release),
#      so MERGING THAT PR IS THE RELEASE — no manual `git tag` anymore.
#   2. `build` — compile all combinations in one job at the tagged commit,
#      attest build provenance, and attach every wasm to one GitHub release.
#   3. `publish` — verify each asset's attestation, then publish each to the
#      `oz/` sub-registry via the stellar-registry CLI, skipping combinations
#      already on-chain. Replaces the manual scripts/publish.sh run (which
#      remains the local fallback).
#
# The build/publish jobs hang off detect-releases's outputs via `needs:` in
# the SAME run: tags pushed with the default GITHUB_TOKEN don't retrigger
# workflows, so a tag-triggered pipeline would need a GitHub App — this shape
# needs nothing. A manually pushed tag therefore does nothing; bump the
# version (or re-run via workflow_dispatch below) instead.
#
# Required repo config for the publish half:
#   - secret REGISTRY_PUBLISH_SECRET_KEY — S… seed of the account bound as
#     author of the oz/* names (fee source + publish signer).
#   - optional var REGISTRY_AUTHOR_ADDRESS — G… author override; unset means
#     the signing key's own account.

on:
  push:
    branches: [main]
  # Recovery path — PUBLISH-ONLY: re-run the on-chain half against the
  # existing, already-attested release assets for a tag (e.g. after a
  # transient RPC failure; already-published combinations are skipped
  # automatically). It never rebuilds. If the BUILD half failed instead, use
  # the failed run's native "Re-run failed jobs" (same sha), after deleting
  # the GitHub release if it got as far as creating one (`gh release delete
  # <tag>` — keep the tag).
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing release tag to (re)publish to the registry, e.g. v0.7.2"
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-dispatch-{0}', inputs.publish_tag) || 'release' }}
  cancel-in-progress: false

jobs:
  # Tag v<version> when the workspace version was bumped past the last tag.
  # A queued run dropped by the concurrency group self-heals: the next push
  # re-compares manifest vs tags and releases anything still pending.
  detect-releases:
    if: github.event_name == 'push'
    permissions:
      contents: write # push the release tag
    uses: stellar-registry/actions/.github/workflows/detect-releases.yml@e57ca8efd2b07c4d8294cdc600140fed754dbcec # main 2026-09
    with:
      contracts: '[{"name": "oz-combined-wasms", "manifest": "Cargo.toml", "tag_prefix": "v", "version_from": "workspace"}]'

  # Extract + strictly validate this run's tag (push: from detect-releases;
  # dispatch: from the input). The tag flows into later `run:` shells, so
  # anything beyond exact v<semver> shape is rejected.
  release-params:
    needs: detect-releases
    # !cancelled(): on dispatch the detect-releases job is skipped, which
    # would otherwise skip everything downstream of this `needs:`.
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '') ||
        needs.detect-releases.outputs.releases_created == 'true'
      )
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.params.outputs.tag }}
      version: ${{ steps.params.outputs.version }}
    env:
      RELEASES: ${{ needs.detect-releases.outputs.releases }}
      DISPATCH_TAG: ${{ inputs.publish_tag }}
    steps:
      - name: Extract tag and version
        id: params
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG=$(jq -r '.[0].tag' <<<"$RELEASES")
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected release tag: '$TAG'" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >>"$GITHUB_OUTPUT"

  # Build every combination in a single job (shared compilation), attest, and
  # create ONE GitHub release holding all wasms. Push-only: on push this run's
  # github.sha IS the commit detect-releases tagged; a dispatch never rebuilds
  # (it republishes the existing attested assets — integrity comes from the
  # attestation verify in `publish`, not from git position).
  #
  # No Swatinem/rust-cache here on purpose: these artifacts are attested and
  # published on-chain, and a poisoned cache entry would be attested along
  # with everything else. Releases are rare; the cold build is acceptable.
  build:
    needs: release-params
    if: >-
      !cancelled() &&
      needs.release-params.result == 'success' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    env:
      TAG: ${{ needs.release-params.outputs.tag }}
      VERSION: ${{ needs.release-params.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # gh uses GH_TOKEN; git creds unneeded

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32v1-none

      # v26.0.0: Protocol 26 support, spec shaking, --optimize is the default
      - uses: stellar/stellar-cli@60f7458e7ecffddf2f2d91dc6d0d2db4fab03ecc # v26.0.0
        with:
          version: '26.0.0'

      - name: Cross-check the workspace version against the tag
        run: |
          set -euo pipefail
          VER=$(sed -n '/\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml)
          if [ "$VER" != "$VERSION" ]; then
            echo "tag version $VERSION != workspace version $VER" >&2
            exit 1
          fi

      - name: Build all combinations
        run: |
          set -euo pipefail
          mkdir -p wasms
          for dir in generated/*/; do
            pkg=$(basename "$dir")
            stellar contract build \
              --package "$pkg" \
              --out-dir wasms \
              --meta "source_repo=github:${GITHUB_REPOSITORY}" \
              --meta "home_domain=rgstry.xyz"

            # stellar contract build names the output after the Rust lib name
            # (hyphens become underscores). Rename to the canonical form the
            # publish half parses: <package>_v<version>.wasm
            lib="${pkg//-/_}"
            mv "wasms/${lib}.wasm" "wasms/${pkg}_v${VERSION}.wasm"
          done

      - name: Post build info to stellar.expert (contract validation matching)
        run: |
          for wasm in wasms/*.wasm; do
            pkg=$(basename "$wasm" | sed 's/_v[0-9].*//')
            hash=$(sha256sum "$wasm" | cut -d' ' -f1)
            curl -sX POST \
              "https://api.stellar.expert/explorer/public/contract-validation/match" \
              -H "Content-Type: application/json" \
              -d "{
                \"repository\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}\",
                \"commitHash\": \"${GITHUB_SHA}\",
                \"jobId\":       \"${GITHUB_JOB}\",
                \"runId\":       \"${GITHUB_RUN_ID}\",
                \"contractHash\":\"$hash\",
                \"packageName\": \"$pkg\"
              }" \
              --max-time 15 || true
          done

      - name: Attest WASMs
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'wasms/*.wasm'

      - name: Create GitHub release with all WASMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" wasms/*.wasm \
            --title "$TAG" \
            --notes "Pre-built Soroban WASM combinations compiled against OpenZeppelin stellar-contracts $TAG. Published to the oz/ sub-registry (see registry-publish-receipts.json)."

  # Publish every attested asset to the oz/ sub-registry. On push it consumes
  # the freshly built release; on dispatch it republishes an existing one
  # (build is skipped by design — provenance is verified either way).
  publish:
    needs: [release-params, build]
    if: >-
      !cancelled() &&
      needs.release-params.result == 'success' &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped'))
    permissions:
      contents: write # download the assets + upload the receipts
    uses: stellar-registry/actions/.github/workflows/registry-publish-assets.yml@e57ca8efd2b07c4d8294cdc600140fed754dbcec # main 2026-09
    with:
      release_tag: ${{ needs.release-params.outputs.tag }}
      name_prefix: "oz/"
      network: mainnet
      # Matches scripts/publish.sh: generous inclusion-fee cap for mainnet.
      inclusion_fee: "10000000"
      # Empty (var unset) = the signing key's own account.
      author: ${{ vars.REGISTRY_AUTHOR_ADDRESS }}
    secrets:
      signing_key: ${{ secrets.REGISTRY_PUBLISH_SECRET_KEY }}
      release_token: ${{ secrets.GITHUB_TOKEN }}
